[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harnessflow-cli"
version = "0.1.0"
description = "Command-line client for HarnessFlow PRD projects"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
harnessflow = "harnessflow_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["harnessflow_cli"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
