# sqlc generates type-safe Go from the SQL in internal/store/queries against
# the migrations in apps/api/migrations. Run `make sqlc` to regenerate.
version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: internal/store/queries
    gen:
      go:
        package: store
        out: internal/store
        sql_package: pgx/v5
        emit_json_tags: true
        emit_db_tags: true
        emit_interface: true
        emit_pointers_for_null_types: true
        emit_methods_with_db_argument: false
