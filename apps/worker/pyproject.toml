[project]
name = "harnessflow-worker"
version = "0.1.0"
description = "HarnessFlow Python worker — executes Temporal activities (LLM, retrieval, tools, verify)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "temporalio>=1.9.0",
    "pydantic>=2.10.0",
    "structlog>=24.4.0",
    "openai>=1.50.0",
    "anthropic>=0.40.0",
    "asyncpg>=0.30.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27.0",
]

[project.scripts]
harnessflow-worker = "harnessflow_worker.__main__:main"

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harnessflow_worker"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# Third-party libraries without bundled type stubs. Narrow + documented to
# keep the surface for future stub adoption obvious.
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true
