name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      HARNESSFLOW_MOCK: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: |
            apps/api/go.sum
            packages/sdk/gen/go/go.sum
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: "10.11.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/dashboard/pnpm-lock.yaml
      - name: Install locked application dependencies
        run: make setup
      - name: Install pinned Go tooling
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          go install github.com/bufbuild/buf/cmd/buf@v1.69.0
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
      - name: Generated contracts and queries stay in sync
        run: |
          make proto sqlc
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard packages/sdk/gen apps/dashboard/src/gen apps/api/internal/store)"
      - name: Unit tests, linters, types, production builds
        run: make check
      - name: Launcher tests and configuration syntax
        run: |
          python3 -m unittest discover -s scripts/tests -v
          bash -n scripts/demo.sh
          docker compose config --quiet
      - name: Install browser test runtime
        run: |
          python -m pip install playwright==1.60.0
          python -m playwright install --with-deps chromium
      - name: Browser project workflow and replay contract
        working-directory: apps/dashboard
        run: |
          ./node_modules/.bin/next start --hostname 127.0.0.1 --port 3100 > /tmp/dashboard-browser.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 60); do
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/dashboard-browser.log
              exit 1
            fi
            if curl -fsS http://127.0.0.1:3100/projects > /dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat /tmp/dashboard-browser.log
            exit 1
          fi
          python tests/browser_project_smoke.py --url http://127.0.0.1:3100 --screenshot /tmp/harnessflow-project-run.png
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: |
            /tmp/harnessflow-project-run.png
            /tmp/harnessflow-project-intake.png
            /tmp/dashboard-browser.log
          if-no-files-found: ignore
