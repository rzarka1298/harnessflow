# HarnessFlow local development stack.
#
#   make up      start everything
#   make down    stop everything
#   make logs    tail logs
#
# UIs once up:
#   Temporal     http://localhost:8233
#   Jaeger       http://localhost:16686
#   Prometheus   http://localhost:9090
#   Grafana      http://localhost:3000   (anonymous admin)
#   MinIO        http://localhost:9001   (harnessflow / harnessflow)
#   Redpanda     kafka API on localhost:19092; console http://localhost:8085
#
# Application services (api, worker, dashboard) are added to this file as they
# are wired up — api in Week 2, worker in Week 3, dashboard in Week 4. Until
# then they run on the host (`go run`, `uv run`, `pnpm dev`) against this stack.

name: harnessflow

services:
  # --- State -----------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: harnessflow
      POSTGRES_PASSWORD: harnessflow
      POSTGRES_DB: harnessflow
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harnessflow"]
      interval: 5s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Workflow engine -------------------------------------------------------
  temporal:
    image: temporalio/auto-setup:1.27.2
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=harnessflow
      - POSTGRES_PWD=harnessflow
      - POSTGRES_SEEDS=postgres
      - DBNAME=temporal
      - VISIBILITY_DBNAME=temporal_visibility
    ports:
      - "7233:7233"
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "temporal:7233"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  temporal-ui:
    image: temporalio/ui:2.34.0
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:8233
    ports:
      - "8233:8080"

  # --- Observability ---------------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1
    command: ["--config=/etc/otel/collector-config.yaml"]
    volumes:
      - ./infrastructure/otel/collector-config.yaml:/etc/otel/collector-config.yaml:ro
    depends_on:
      - jaeger
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686" # UI

  prometheus:
    image: prom/prometheus:v3.1.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.4.0
    depends_on:
      - prometheus
      - jaeger
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_SECURITY_ADMIN_PASSWORD=harnessflow
    volumes:
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"

  # --- Artifact storage ------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: harnessflow
      MINIO_ROOT_PASSWORD: harnessflow
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # --- Event firehose (ADR-0004) ---------------------------------------------
  # Single-binary Redpanda in KRaft dev mode — the Kafka-API substrate for the
  # workflow-events topic. Auto-creates topics in dev, so the producer/consumer
  # need no pre-provisioning. The worker emits to it (when
  # HARNESSFLOW_EVENTS_BROKERS is set) and apps/event-consumer drains it to
  # Parquet on MinIO/S3.
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --default-log-level=info
      # Two listeners: PLAINTEXT for in-network clients, OUTSIDE for the host.
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:19092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092,OUTSIDE://localhost:19092
    ports:
      - "19092:19092" # Kafka API (host)
      - "9644:9644" # Admin API
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Web UI for inspecting topics/messages — handy when demoing the firehose.
  redpanda-console:
    image: redpandadata/console:v2.7.2
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "8085:8080"

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
  minio-data:
