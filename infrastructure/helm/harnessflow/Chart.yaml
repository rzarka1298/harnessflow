apiVersion: v2
name: harnessflow
description: |
  HarnessFlow — AI workflow orchestration, observability, CI/CD, and
  evaluation platform. This chart deploys the three first-party services
  (api, worker, dashboard) and optionally pulls in upstream Postgres /
  Redis / Temporal subcharts so the stack is installable end-to-end.
type: application
version: 0.1.0
appVersion: "0.5.0"
maintainers:
  - name: rzarka1298
    url: https://github.com/rzarka1298/harnessflow
keywords:
  - ai
  - workflows
  - temporal
  - observability

# Subcharts are toggled via values.yaml — each dependency only installs
# when its `enabled` flag is true. This lets users point at managed
# services (e.g. RDS Postgres, MSK-like Temporal) in production while
# keeping the local kind install batteries-included.
dependencies:
  - name: postgresql
    version: "16.2.1"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: redis
    version: "20.6.2"
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
  - name: temporal
    version: "0.62.0"
    repository: https://go.temporal.io/helm-charts
    condition: temporal.enabled
