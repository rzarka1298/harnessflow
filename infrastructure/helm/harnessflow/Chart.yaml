apiVersion: v2
name: harnessflow
description: |
  HarnessFlow — AI workflow orchestration, observability, CI/CD, and
  evaluation platform. This chart deploys the three first-party services
  (api, worker, dashboard) and optionally pulls in upstream Postgres /
  Redis / Temporal subcharts so the stack is installable end-to-end.
type: application
version: 0.1.0
appVersion: "0.5.0"
maintainers:
  - name: rzarka1298
    url: https://github.com/rzarka1298/harnessflow
keywords:
  - ai
  - workflows
  - temporal
  - observability

# Postgres and Redis are first-party templates in this chart (plain
# Deployments on the official postgres:16-alpine / redis:7-alpine images),
# not subcharts — see templates/postgres.yaml / redis.yaml. We dropped the
# bitnami subcharts after their 2025 catalog migration pulled the public
# images out from under `helm install`; the bundled DB only ever serves
# local/demo (production points externalPostgres/externalRedis at managed
# services), so bitnami's production hardening bought us nothing but a
# fragile image dependency.
#
# Temporal stays a subchart (the official temporalio/temporal chart),
# toggled by temporal.enabled.
dependencies:
  - name: temporal
    version: "0.62.0"
    repository: https://go.temporal.io/helm-charts
    condition: temporal.enabled
