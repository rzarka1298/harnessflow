{{- if .Values.env.keys.create -}}
{{/* In-chart LLM-keys secret. Use for kind / dev installs only — for
     production point at an out-of-band secret with env.keys.existing
     (e.g. an ExternalSecret sourced from AWS SSM / Vault). */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-llm-keys" (include "harnessflow.fullname" .) }}
  labels:
    {{- include "harnessflow.labels" . | nindent 4 }}
type: Opaque
stringData:
  OPENAI_API_KEY: {{ .Values.env.keys.openaiApiKey | default "" | quote }}
  ANTHROPIC_API_KEY: {{ .Values.env.keys.anthropicApiKey | default "" | quote }}
{{- end -}}
