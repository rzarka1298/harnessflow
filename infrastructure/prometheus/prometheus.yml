# Prometheus scrape configuration for HarnessFlow local dev.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # HarnessFlow application metrics, routed through the OTel Collector's
  # Prometheus exporter.
  - job_name: otel-collector-app-metrics
    static_configs:
      - targets: ["otel-collector:8889"]

  # The collector's own internal telemetry.
  - job_name: otel-collector-internal
    static_configs:
      - targets: ["otel-collector:8888"]

  # Reserved — uncommented as services expose /metrics directly:
  # - job_name: harnessflow-api
  #   static_configs:
  #     - targets: ["api:8080"]
  # - job_name: temporal
  #   static_configs:
  #     - targets: ["temporal:9090"]
