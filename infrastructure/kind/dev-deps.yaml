# Plain Postgres + Redis for the local kind smoke test.
#
# Why this exists: the chart's default `postgresql` / `redis` subcharts are
# bitnami's, and bitnami pulled their public Docker images during the 2025
# catalog migration (e.g. docker.io/bitnami/postgresql:17.x → NotFound).
# Until the chart's subchart provider is revisited, the kind smoke test
# installs the chart with `postgresql.enabled=false redis.enabled=false`
# and points externalPostgres/externalRedis at these plain Deployments.
#
# Apply into the release namespace before `helm install`:
#   kubectl create namespace hf
#   kubectl apply -n hf -f infrastructure/kind/dev-deps.yaml
#   kubectl wait --for=condition=ready pod -l app=postgres -n hf --timeout=90s
#
# The Secret key `postgres-password` matches what the chart expects via
# externalPostgres.existingSecret.
apiVersion: v1
kind: Secret
metadata:
  name: hf-pg
type: Opaque
stringData:
  postgres-password: harnessflow
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - { name: POSTGRES_USER, value: harnessflow }
            - { name: POSTGRES_PASSWORD, value: harnessflow }
            - { name: POSTGRES_DB, value: harnessflow }
          ports:
            - containerPort: 5432
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "harnessflow"] }
            initialDelaySeconds: 3
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: { app: postgres }
  ports:
    - { port: 5432, targetPort: 5432 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector: { app: redis }
  ports:
    - { port: 6379, targetPort: 6379 }
