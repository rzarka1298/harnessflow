# Grafana datasource provisioning for HarnessFlow local dev.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    # Fixed UID so the committed dashboard JSON can reference it reproducibly.
    uid: harnessflow-prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    editable: false
