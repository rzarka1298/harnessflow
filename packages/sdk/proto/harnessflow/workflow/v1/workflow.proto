syntax = "proto3";

// Package harnessflow.workflow.v1 defines workflow definitions and the RPC
// surface for creating, inspecting, and running them.
package harnessflow.workflow.v1;

import "google/protobuf/timestamp.proto";

// WorkflowStatus is the lifecycle state of a workflow definition.
enum WorkflowStatus {
  WORKFLOW_STATUS_UNSPECIFIED = 0;
  // DRAFT: created but not yet activated; cannot be run.
  WORKFLOW_STATUS_DRAFT = 1;
  // ACTIVE: runnable.
  WORKFLOW_STATUS_ACTIVE = 2;
  // ARCHIVED: retained for history, not runnable.
  WORKFLOW_STATUS_ARCHIVED = 3;
}

// Workflow is a versioned AI workflow definition. The authoritative content is
// yaml_source, written in the HarnessFlow YAML DSL (see packages/workflow-dsl).
message Workflow {
  string id = 1;
  string name = 2;
  // version increments each time a workflow with the same name is re-created.
  int32 version = 3;
  string description = 4;
  // yaml_source is the full workflow definition in HarnessFlow YAML DSL.
  string yaml_source = 5;
  WorkflowStatus status = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message CreateWorkflowRequest {
  // yaml_source is validated against packages/sdk/schema/workflow.schema.json.
  string yaml_source = 1;
}

message CreateWorkflowResponse {
  Workflow workflow = 1;
}

message GetWorkflowRequest {
  string id = 1;
}

message GetWorkflowResponse {
  Workflow workflow = 1;
}

message ListWorkflowsRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message ListWorkflowsResponse {
  repeated Workflow workflows = 1;
  string next_page_token = 2;
}

message RunWorkflowRequest {
  string workflow_id = 1;
  // inputs are key/value parameters bound into the workflow run.
  map<string, string> inputs = 2;
}

message RunWorkflowResponse {
  // run_id identifies the started run; poll harnessflow.run.v1.RunService.
  string run_id = 1;
}

// WorkflowService manages workflow definitions and starts runs.
service WorkflowService {
  // CreateWorkflow validates YAML and persists a new workflow version.
  rpc CreateWorkflow(CreateWorkflowRequest) returns (CreateWorkflowResponse);
  // GetWorkflow returns a single workflow by id.
  rpc GetWorkflow(GetWorkflowRequest) returns (GetWorkflowResponse);
  // ListWorkflows returns workflows, newest first, paginated.
  rpc ListWorkflows(ListWorkflowsRequest) returns (ListWorkflowsResponse);
  // RunWorkflow compiles the workflow to a Temporal workflow and starts a run.
  rpc RunWorkflow(RunWorkflowRequest) returns (RunWorkflowResponse);
}
