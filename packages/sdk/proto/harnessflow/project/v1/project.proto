syntax = "proto3";
package harnessflow.project.v1;
import "google/protobuf/timestamp.proto";

message Project {
  string id = 1;
  string name = 2;
  string repository_path = 3;
  string prd = 4;
  google.protobuf.Timestamp created_at = 5;
}
message ProjectRun {
  string id = 1;
  string project_id = 2;
  string status = 3;
  string reason = 4;
  string snapshot_json = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}
message CreateProjectRequest { string name = 1; string repository_path = 2; string prd = 3; }
message CreateProjectResponse { Project project = 1; }
message GetProjectRequest { string id = 1; }
message GetProjectResponse { Project project = 1; }
message ListProjectsRequest { int32 page_size = 1; string page_token = 2; }
message ListProjectsResponse { repeated Project projects = 1; string next_page_token = 2; }
message StartRunRequest {
  string project_id = 1;
  int32 max_attempts = 2;
  int32 max_duration_seconds = 3;
  string model = 4;
  bool request_pr = 5;
}
message StartRunResponse { ProjectRun run = 1; }
message GetRunRequest { string id = 1; }
message GetRunResponse { ProjectRun run = 1; }
message ListRunsRequest { string project_id = 1; int32 page_size = 2; string page_token = 3; }
message ListRunsResponse { repeated ProjectRun runs = 1; string next_page_token = 2; }
message ControlRunRequest {
  string run_id = 1;
  string action = 2; // pause, resume, cancel
  string clarification = 3;
  int32 additional_attempts = 4;
  int32 additional_seconds = 5;
}
message ControlRunResponse { ProjectRun run = 1; }
message GetArtifactsRequest { string run_id = 1; }
message GetArtifactsResponse { string snapshot_json = 1; }
service ProjectService {
  rpc CreateProject(CreateProjectRequest) returns (CreateProjectResponse);
  rpc GetProject(GetProjectRequest) returns (GetProjectResponse);
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse);
  rpc StartRun(StartRunRequest) returns (StartRunResponse);
  rpc GetRun(GetRunRequest) returns (GetRunResponse);
  rpc ListRuns(ListRunsRequest) returns (ListRunsResponse);
  rpc ControlRun(ControlRunRequest) returns (ControlRunResponse);
  rpc GetArtifacts(GetArtifactsRequest) returns (GetArtifactsResponse);
}
